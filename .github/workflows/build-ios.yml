name: Build chiaki-lib iOS

on:
  workflow_dispatch:
  push:
    branches: [ios-lib-build]

jobs:
  build-ios:
    name: Build chiaki-lib iOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade 'protobuf>=5.29,<6' --break-system-packages
          brew install ninja protobuf@29
          echo "PROTOC=$(brew --prefix protobuf@29)/bin/protoc" >> $GITHUB_ENV

      - name: Build chiaki-lib
        run: scripts/build-ios.sh

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: ChiakiLib-ios-arm64
          path: build-ios/ChiakiLib.xcframework
          if-no-files-found: error
          retention-days: 7
