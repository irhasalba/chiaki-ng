workflows:
  chiaki-lib-ios:
    name: Build chiaki-lib iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-lib-build
    scripts:
      - name: Fetch submodules
        script: git submodule update --init --recursive
      - name: Install dependencies
        script: |
          python3 -m pip install --upgrade 'protobuf>=5.29,<6' --break-system-packages
          brew install ninja cmake protobuf@29 xcodegen
          echo "PROTOC=$(brew --prefix protobuf@29)/bin/protoc" >> $CM_ENV
      - name: Build chiaki-lib
        script: scripts/build-ios.sh
      - name: Package xcframework
        script: cd build-ios && zip -qry ChiakiLib.xcframework.zip ChiakiLib.xcframework
      - name: Build iOS app
        script: scripts/build-ios-app.sh
    artifacts:
      - build-ios/ChiakiLib.xcframework.zip
      - ios/ChiakiApp.ipa
